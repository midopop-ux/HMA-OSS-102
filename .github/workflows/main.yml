name: Build & Release HMA-102

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release on ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Determine Version & Build Number
        run: |
          SUCCESS_COUNT=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs?status=success" \
            | jq -r '.total_count // 0')
          REL_COUNT=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases" \
            | jq -r 'if type=="array" then length else 0 end')
          if [ "$REL_COUNT" -gt "$SUCCESS_COUNT" ]; then
            COUNT=$REL_COUNT
          else
            COUNT=$SUCCESS_COUNT
          fi
          BUILD_NUM=$((COUNT + 1))
          VERSION_NAME=$(awk -v b="$BUILD_NUM" 'BEGIN { printf "%.1f", b * 0.1 }')
          echo "APP_VERSION_CODE=$BUILD_NUM" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=HMA-102 v$VERSION_NAME" >> $GITHUB_ENV
          echo "=== Build Version: $VERSION_NAME (Code: $BUILD_NUM) ==="

      - name: Configure Keystore & Signing
        run: |
          if [ -n "${{ secrets.KEY_STORE }}" ]; then
            echo officialBuild=true >> local.properties
            echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> local.properties
            echo keyAlias='${{ secrets.ALIAS }}' >> local.properties
            echo keyPassword='${{ secrets.ALIAS_KEY_PASSWORD }}' >> local.properties
            echo fileDir=`pwd`/key.jks >> local.properties
            echo "${{ secrets.KEY_STORE }}" | base64 --decode > key.jks
          else
            echo "No KEY_STORE secret set, signing release with default debug config"
          fi
          if [ -n "${{ secrets.CROWDIN_PROJECT_ID }}" ]; then
            echo crowdinProjectId='${{ secrets.CROWDIN_PROJECT_ID }}' >> local.properties
            echo crowdinApiKey='${{ secrets.CROWDIN_LIST_MEMBERS_API_TOKEN }}' >> local.properties
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Release APK (ProGuard Optimized)
        run: |
          ./gradlew assembleRelease
          mkdir -p final_apk
          cp app/build/outputs/apk/release/*.apk final_apk/HMA-102-v${{ env.APP_VERSION_NAME }}-release.apk

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HMA-102-v${{ env.APP_VERSION_NAME }}-release
          path: final_apk/*.apk

      - name: Upload ProGuard Mappings
        uses: actions/upload-artifact@v4
        with:
          name: mappings
          path: "app/build/outputs/mapping/release"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          body: |
            ### HMA-102 ${{ env.RELEASE_NAME }}
            - Modern libxposed API 102 integration.
            - Package: `org.midopop_ux.hma_102`
            - Compressed Release with ProGuard/R8 optimizations.
          draft: false
          prerelease: false
          files: |
            final_apk/HMA-102-v${{ env.APP_VERSION_NAME }}-release.apk
